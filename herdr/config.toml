# herdr config — 推奨初期値（v0.8系・公式docs記載のキーのみ）
onboarding = false

[ui.toast]
# 通知は default OFF のため明示的に有効化
delivery = "system"

[ui.sound.agents]
claude = "on"

[session]
resume_agents_on_restore = true

# tmux と入れ子にする場合は prefix 変更を検討（default は ctrl+b）
# [keys]
# prefix = "ctrl+a"

# プラグイン: mise run setup が未導入なら herdr plugin install する
# reviewr: エージェントの diff をレビューしてコメントを送り返すペイン
[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle review pane"

# pluck: 画面上のトークン（パス・URL・SHA等）をヒントキーでコピー
# README 例は prefix+q だが herdr 既定のデタッチキーと衝突するため yank 連想で y
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "rmarganti.herdr-pluck.pluck"
description = "pluck: copy visible token"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "rmarganti.herdr-pluck.open-url"
description = "pluck: open visible URL"

# 日本語IME向け（必要になったら有効化・experimental）
# [experimental]
# reveal_hidden_cursor_for_cjk_ime = true
# cjk_ime_agents = ["claude", "codex"]
