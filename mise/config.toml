[settings]
experimental = true
disable_backends = ["asdf", "vfox"]

[settings.pipx]
uvx = true

[tasks.setup]
description = "Symlink dotfiles into $HOME (backs up existing files) and install TPM"
run = '''
# 冪等に symlink を張る。既存の実ファイルは .bak.<日時> へ退避
set -u
REPO="$HOME/dotfiles"
TS="$(date +%Y%m%d_%H%M%S)"

link() {
  src="$REPO/$1"; dst="$2"
  mkdir -p "$(dirname "$dst")"
  if [ -L "$dst" ]; then
    rm "$dst"
  elif [ -e "$dst" ]; then
    mv "$dst" "$dst.bak.$TS"
    echo "退避: $dst → $dst.bak.$TS"
  fi
  ln -s "$src" "$dst"
  echo "リンク: $dst → $src"
}

link ghostty/config    "$HOME/.config/ghostty/config"
link herdr/config.toml "$HOME/.config/herdr/config.toml"
link mise/config.toml  "$HOME/.config/mise/config.toml"
link .zshrc            "$HOME/.zshrc"
link .zprofile         "$HOME/.zprofile"
link .tmux.conf        "$HOME/.tmux.conf"
link .gitconfig        "$HOME/.gitconfig"
link zed/settings.json "$HOME/.config/zed/settings.json"
link claude/statusline-ccusage.sh "$HOME/.claude/statusline-ccusage.sh"
link claude/ccusage.json "$HOME/.claude/ccusage.json"

# Claude Code statusline (ccusage) — settings.json に statusLine が無ければ追記。
# settings.json は Claude Code 自身が書き換えるため symlink 管理せず、キー単位で冪等マージする
/usr/bin/python3 - <<'PY'
import json, os
p = os.path.expanduser("~/.claude/settings.json")
os.makedirs(os.path.dirname(p), exist_ok=True)
try:
    with open(p) as f:
        s = json.load(f)
except FileNotFoundError:
    s = {}
except json.JSONDecodeError:
    print(f"statusLine: {p} が不正なJSONのためスキップ(手動確認を)")
    raise SystemExit(0)
if "statusLine" not in s:
    s["statusLine"] = {
        "type": "command",
        "command": os.path.expanduser("~/.claude/statusline-ccusage.sh"),
        "padding": 0,
    }
    with open(p, "w") as f:
        json.dump(s, f, indent=2, ensure_ascii=False)
        f.write("\n")
    print("statusLine: settings.json に追加")
else:
    print("statusLine: 設定済み — スキップ")
PY

# tmux plugin manager (TPM) — .tmux.conf が参照
[ -d "$HOME/.tmux/plugins/tpm" ] || git clone https://github.com/tmux-plugins/tpm "$HOME/.tmux/plugins/tpm"

# herdr プラグイン — herdr/config.toml のキーバインドが参照。
# 新規マシンでは setup が mise install より先のため、herdr 未導入なら案内してスキップ
if command -v herdr >/dev/null 2>&1; then
  herdr plugin list 2>/dev/null | grep -q "persiyanov.reviewr" || herdr plugin install persiyanov/herdr-reviewr --yes
  herdr plugin list 2>/dev/null | grep -q "rmarganti.herdr-pluck" || herdr plugin install rmarganti/herdr-pluck --yes
  # 通知は初回のみ システム設定 → 通知 → herdr で許可が必要
  herdr plugin list 2>/dev/null | grep -q "dot.terminal-notifier" || herdr plugin install dot/herdr-terminal-notifier --yes
else
  echo "herdr 未導入 — mise install 後にもう一度 mise run setup を実行するとプラグインが入ります"
fi

echo "完了。herdr 起動中なら反映: herdr server reload-config"
'''

[tools]
aws = "latest"
terraform = "latest"
github-cli = "latest"
python = "3.14.0"
uv = "latest"
cmake = "latest"
pnpm = "latest"
node = "lts"
git-lfs = "latest"
ripgrep = "latest"
glow = "latest"
task = "latest"
# registry: aqua:herdrdev/herdr — 旧miseだと未収載エラー。対処: brew upgrade mise
herdr = "latest"
# registry: aqua:anthropics/claude-code。初回は claude login が必要
claude = "latest"
# Claude Code のローカル使用ログからコスト集計。statusline は ~/.claude/settings.json 参照
"npm:ccusage" = "latest"
